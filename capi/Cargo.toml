[package]
name = "marshal-rs-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
publish = false

[package.metadata.capi.header]
name = "marshal"
subdirectory = "marshal-rs"

[package.metadata.capi.pkg_config]
name = "marshal-rs"
filename = "marshal-rs"

[package.metadata.capi.library]
name = "marshal_rs"

[lib]
name = "marshal_rs"
crate-type = ["cdylib", "staticlib"]
doctest = false

[features]
default = ["std"]
std = ["marshal-rs/std"]
capi = []

[dependencies]
marshal-rs = { path = "..", default-features = false, features = ["alloc"] }
