language = "C"
style = "type"
include_guard = "MARSHAL_RS_H"
autogen_warning = "/* Generated by cbindgen from the Rust sources of marshal-rs-capi. Do not edit. */"
cpp_compat = true
usize_is_size_t = true
documentation_style = "c"
line_length = 120
tab_width = 4
braces = "SameLine"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
