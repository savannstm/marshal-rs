[package]
name = "marshal-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
[[bin]]
name = "load"
path = "fuzz_targets/load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ser"
path = "fuzz_targets/ser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "de"
path = "fuzz_targets/de.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bignum"
path = "fuzz_targets/bignum.rs"
test = false
doc = false
bench = false

[[bin]]
name = "builder"
path = "fuzz_targets/builder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reader"
path = "fuzz_targets/reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capi"
path = "fuzz_targets/capi.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4.13"
marshal-rs = { path = "..", features = ["alloc", "std", "serde"] }
marshal_rs_capi = { package = "marshal-rs-capi", path = "../capi", features = ["std", "capi"] }
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }
