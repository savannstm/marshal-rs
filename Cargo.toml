[package]
name = "marshal-rs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/marshal-rs/"
license.workspace = true
keywords = ["marshal", "ruby", "serialize", "deserialize", "no_std"]
categories = ["encoding", "parser-implementations", "no-std"]
exclude = [
    "/.gitignore",
    "/.gitattributes",
    "/.clang-format",
    "/.clang-tidy",
    "/.github",
    "/rustfmt.toml",
    "/benches",
]

[workspace]
members = ["capi", "wasm"]

[workspace.package]
version = "4.0.0"
edition = "2021"
rust-version = "1.81.0"
authors = ["savannstm <savannstm@gmail.com>"]
description = "Blazingly fast, no_std-capable Ruby-lang Marshal implementation in Rust."
license = "WTFPL"
repository = "https://github.com/savannstm/marshal-rs"
homepage = "https://crates.io/crates/marshal-rs"

[features]
default = ["std", "serde"]
# The DOM (Arena, ValueRef, load/dump). Pulls in `alloc`.
alloc = []
# std::io-backed I/O. Pulls in `alloc`.
std = ["alloc"]
# Streaming Serialize/Deserialize for the arena. Pulls in `alloc`.
serde = ["alloc", "dep:serde"]

[dependencies]
serde = { version = "1.0.229", optional = true, default-features = false, features = [
    "alloc",
] }
thiserror = { version = "2.0.21", default-features = false }

[dev-dependencies]
ciborium = "0.2.2"
criterion = { version = "0.8.2", default-features = false }
serde_json = "1.0.154"
yaml_serde = "0.10.7"

[[test]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "ruby_fixtures"
required-features = ["serde"]

[[example]]
name = "basic"
required-features = ["alloc"]

[[example]]
name = "fixture_check"
required-features = ["alloc"]

[[example]]
name = "yaml"
required-features = ["serde"]

[[bench]]
name = "load_dump"
harness = false
required-features = ["alloc"]

[[bench]]
name = "marshal_c_compare"
harness = false
required-features = ["alloc"]

# The `no_std` C build needs abort-on-panic, and the panic handler in capi/src/lib.rs aborts anyway.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
