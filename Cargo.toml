[package]
name = "marshal-rs"
version = "2.0.2"
authors = ["savannstm <savannstm@gmail.com>"]
edition = "2021"
rust-version = "1.85.0"
description = "Blazingly fast Ruby-lang's Marshal implementation in Rust."
readme = "README.md"
repository = "https://github.com/savannstm/marshal-rs"
documentation = "https://docs.rs/marshal-rs/"
license-file = "LICENSE.md"
keywords = ["marshal", "ruby", "serialize", "deserialize"]

[dependencies]
bitflags = "2.13.1"
encoding_rs = "0.8.35"
gxhash = { version = "3.5.0", features = ["deterministic"] }
indexmap = { version = "2.14.0", features = ["serde"] }
num-bigint = "0.5.1"
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
strum_macros = "0.28.0"
thiserror = "2.0.20"
