[package]
name = "marshal-rs-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
# `wasm-bindgen` itself needs 1.81.
rust-version = "1.81.0"
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/savannstm/marshal-rs/tree/master/wasm"
keywords = ["marshal", "ruby", "wasm", "serialize", "deserialize"]
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--converge",
    "--low-memory-unused",
    "--strip-producers",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-multivalue",
    "--enable-reference-types",
]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
js-sys = "0.3.106"
marshal-rs = { path = "..", default-features = false, features = [
    "alloc",
    "serde",
] }
serde = "1.0.229"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
